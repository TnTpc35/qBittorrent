name: CI - macOS

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Disabled for this branch
        run: echo "macOS CI is manual-only for this Windows-focused branch"
